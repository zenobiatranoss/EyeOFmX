name: Release packages and site

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "eyeofmx-pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build all single-file packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./packaging/build.sh

      - name: Generate static download site
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./site/generate.sh

      - name: List artifacts
        run: find dist site/downloads -type f -printf '%p %s bytes\n' | sort

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/
          if-no-files-found: error

      - name: Upload site for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist/

      - name: Attach packages to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: EyeOFmX ${{ needs.build.outputs.version }}
          generate_release_notes: true
          body: |
            Created by Zenobia — For NT Protection.
            Single-file installers for all Linux distributions. No source or build required.
          files: |
            dist/debian/**/*.deb
            dist/fedora/**/*.rpm
            dist/opensuse/**/*.rpm
            dist/arch/**/*.pkg.tar.zst
            dist/alpine/**/*.apk
            dist/generic/**/*.tar.gz

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy download site
        id: deployment
        uses: actions/deploy-pages@v4
