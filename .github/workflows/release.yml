name: Release packages and site

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (for example 1.0.1)'
        required: true
        default: '1.0.1'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "eyeofmx-pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install native GTK 3 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev pkg-config build-essential rpm

      - name: Set version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build native GTK 3 binary
        run: |
          CGO_CFLAGS="-Wno-deprecated-declarations" \
            go build -tags gtk_3_20 -trimpath -ldflags="-s -w" \
            -o eyeofmx ./cmd/eyeofmx

      - name: Build Debian, RPM and generic packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist/fedora dist/opensuse
          VERSION="$VERSION" ./packaging/debian/build-local.sh
          OUT="$GITHUB_WORKSPACE/dist/fedora" VERSION="$VERSION" ./packaging/rpm/build-local.sh
          OUT="$GITHUB_WORKSPACE/dist/opensuse" VERSION="$VERSION" ./packaging/rpm/build-local.sh
          VERSION="$VERSION" ./packaging/generic/build.sh

      - name: Build Arch package (Docker)
        continue-on-error: true
        timeout-minutes: 20
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist/arch
          DOCKER_BUILDKIT=1 docker build \
            --build-arg "VERSION=$VERSION" \
            --build-arg "ARCH_ARCH=$(uname -m)" \
            --file packaging/arch/Dockerfile \
            --output "type=local,dest=dist/arch" .

      - name: Build Alpine package (Docker)
        continue-on-error: true
        timeout-minutes: 20
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist/alpine
          DOCKER_BUILDKIT=1 docker build \
            --build-arg "VERSION=$VERSION" \
            --build-arg "APK_ARCH=$(uname -m)" \
            --file packaging/alpine/Dockerfile \
            --output "type=local,dest=dist/alpine" .

      - name: Generate checksums for the published files
        run: |
          cd dist
          find . -type f \( -name '*.deb' -o -name '*.rpm' -o \
            -name '*.pkg.tar.zst' -o -name '*.apk' -o -name '*.tar.gz' \) \
            -printf '%p\n' | sort | while read -r f; do
              printf '%s  %s\n' "$(sha256sum "$f" | cut -d' ' -f1)" "${f##*/}"
            done | awk '!seen[$2]++' > SHA256SUMS
          cat SHA256SUMS

      - name: Generate static download site
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./site/generate.sh

      - name: List artifacts
        run: find dist site/downloads -type f -printf '%p %s bytes\n' | sort

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/
          if-no-files-found: error

      - name: Upload site for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist/

      - name: Attach packages to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: EyeOFmX ${{ needs.build.outputs.version }}
          generate_release_notes: true
          overwrite_files: true
          body: |
            Created by Zenobia — For NT Protection.

            The EyeOFmX icon is bundled into the binary for the window and About
            dialog, and installed into the hicolor icon theme by every package.
            Single-file installers for all Linux distributions. No source or build
            required. Verify the files with SHA256SUMS.
          files: |
            dist/debian/**/*.deb
            dist/fedora/**/*.rpm
            dist/opensuse/**/*.rpm
            dist/arch/**/*.pkg.tar.zst
            dist/alpine/**/*.apk
            dist/generic/**/*.tar.gz
            dist/SHA256SUMS

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy download site
        id: deployment
        uses: actions/deploy-pages@v4
